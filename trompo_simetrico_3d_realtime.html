<h2 class="sr-only">Simulación 3D interactiva en tiempo real de un trompo simétrico mostrando precesión, nutación y rotación propia, con cámara controlable por arrastre</h2>
<div id="trompo3d-canvas-wrap" style="width:100%; height:440px; border-radius:var(--border-radius-lg); overflow:hidden; background:var(--color-background-secondary);"></div>
<div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px;">
  <button id="trompo-play" style="display:flex; align-items:center; gap:6px;"><i class="ti ti-player-pause" aria-hidden="true"></i> Pausar</button>
  <button id="trompo-reset" style="display:flex; align-items:center; gap:6px;"><i class="ti ti-refresh" aria-hidden="true"></i> Reiniciar</button>
  <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--color-text-secondary);">
    Velocidad <input type="range" id="trompo-speed" min="0.1" max="2" step="0.1" value="1" style="width:90px;"> <span id="trompo-speed-out" style="min-width:32px; color:var(--color-text-primary); font-weight:500;">1.0x</span>
  </label>
  <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--color-text-secondary);">
    <input type="checkbox" id="trompo-trail" checked> Trayectoria
  </label>
</div>
<div style="display:flex; gap:20px; margin-top:10px; font-size:13px; color:var(--color-text-secondary);">
  <span>t = <span id="trompo-readout-t" style="color:var(--color-text-primary); font-weight:500;">0.00</span> s</span>
  <span>θ = <span id="trompo-readout-theta" style="color:var(--color-text-primary); font-weight:500;">30.0</span>°</span>
  <span>φ = <span id="trompo-readout-phi" style="color:var(--color-text-primary); font-weight:500;">0.0</span>°</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  const m=1.0, g=9.81, l=0.5, I1=0.5, I3=0.2;
  const theta0=0.5235987755982988, phi0=0.0, psi0=0.0;
  const pPhi=9.210254037844386, pPsi=10.346410161513775;
  let state=[theta0, 0.5, phi0, psi0];
  let simTime = 0;
  let playing = true;
  let speed = 1;
  let showTrail = true;

  function deriv(y){
    let theta=y[0], dtheta=y[1], phi=y[2], psi=y[3];
    let s = Math.sin(theta), c = Math.cos(theta);
    if (Math.abs(s) < 1e-6) s = 1e-6;
    const dphi = (pPhi - pPsi*c)/(I1*s*s);
    const dpsi = (pPsi/I3) - dphi*c;
    const d2theta = (dphi*dphi*s*c) - (I3/I1)*(dpsi+dphi*c)*dphi*s + (m*g*l/I1)*s;
    return [dtheta, d2theta, dphi, dpsi];
  }
  function addScaled(y,k,h){
    return [y[0]+h*k[0], y[1]+h*k[1], y[2]+h*k[2], y[3]+h*k[3]];
  }
  function rk4(y, h){
    const k1=deriv(y);
    const k2=deriv(addScaled(y,k1,h/2));
    const k3=deriv(addScaled(y,k2,h/2));
    const k4=deriv(addScaled(y,k3,h));
    return [
      y[0] + (h/6)*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),
      y[1] + (h/6)*(k1[1]+2*k2[1]+2*k3[1]+k4[1]),
      y[2] + (h/6)*(k1[2]+2*k2[2]+2*k3[2]+k4[2]),
      y[3] + (h/6)*(k1[3]+2*k2[3]+2*k3[3]+k4[3])
    ];
  }

  const container = document.getElementById('trompo3d-canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  const dirLight = new THREE.DirectionalLight(0xffffff,0.85);
  dirLight.position.set(2,3,2);
  scene.add(dirLight);

  const floorGeo = new THREE.CircleGeometry(1.3,48);
  const floorMat = new THREE.MeshStandardMaterial({color:0x3a3a3a, side:THREE.DoubleSide});
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  const grid = new THREE.PolarGridHelper(1.3,8,8,64,0x555555,0x4a4a4a);
  scene.add(grid);

  const profilePts = [
    [0.001,0],[0.04,0.05],[0.22,0.20],[0.34,0.40],[0.36,0.58],
    [0.30,0.72],[0.18,0.84],[0.10,0.93],[0.06,0.98],[0.05,1.02]
  ].map(function(p){ return new THREE.Vector2(p[0],p[1]); });
  const trompoGeo = new THREE.LatheGeometry(profilePts, 48);
  const trompoMat = new THREE.MeshStandardMaterial({color:0xBA7517, roughness:0.5, metalness:0.1});
  const trompoMesh = new THREE.Mesh(trompoGeo, trompoMat);

  const pivot = new THREE.Group();
  pivot.add(trompoMesh);
  scene.add(pivot);

  const finMat = new THREE.MeshStandardMaterial({color:0xE24B4A});
  for(let i=0;i<3;i++){
    const finGeo = new THREE.BoxGeometry(0.03,0.5,0.05);
    const fin = new THREE.Mesh(finGeo, finMat);
    const ang = i*2*Math.PI/3;
    fin.position.set(0.37*Math.cos(ang), 0.45, 0.37*Math.sin(ang));
    fin.rotation.y = -ang;
    pivot.add(fin);
  }

  const trailMaxPoints = 600;
  const trailPositions = new Float32Array(trailMaxPoints*3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions,3));
  trailGeo.setDrawRange(0,0);
  const trailMat = new THREE.LineBasicMaterial({color:0x5DCAA5, transparent:true, opacity:0.6});
  const trailLine = new THREE.Line(trailGeo, trailMat);
  scene.add(trailLine);
  let trailCount=0;
  function pushTrailPoint(v){
    if(trailCount<trailMaxPoints){
      trailPositions[trailCount*3]=v.x;
      trailPositions[trailCount*3+1]=v.y;
      trailPositions[trailCount*3+2]=v.z;
      trailCount++;
    } else {
      trailPositions.copyWithin(0,3);
      trailPositions[(trailMaxPoints-1)*3]=v.x;
      trailPositions[(trailMaxPoints-1)*3+1]=v.y;
      trailPositions[(trailMaxPoints-1)*3+2]=v.z;
    }
    trailGeo.setDrawRange(0,trailCount);
    trailGeo.attributes.position.needsUpdate = true;
  }
  function resetTrail(){
    trailCount = 0;
    trailGeo.setDrawRange(0,0);
  }

  const localAxis = new THREE.Vector3(0,1,0);
  const qAlign = new THREE.Quaternion();
  const qSpin = new THREE.Quaternion();
  const axisDir = new THREE.Vector3();
  const topLocalPoint = new THREE.Vector3(0,1.02,0);
  const topWorldPoint = new THREE.Vector3();

  function updateOrientation(){
    const theta=state[0], phi=state[2], psi=state[3];
    axisDir.set(Math.sin(theta)*Math.cos(phi), Math.cos(theta), Math.sin(theta)*Math.sin(phi)).normalize();
    qAlign.setFromUnitVectors(localAxis, axisDir);
    qSpin.setFromAxisAngle(localAxis, psi);
    pivot.quaternion.copy(qAlign).multiply(qSpin);
    if(showTrail){
      topWorldPoint.copy(topLocalPoint).applyQuaternion(pivot.quaternion);
      pushTrailPoint(topWorldPoint);
    }
  }

  let azimuth = Math.PI/4, elevation = 0.5, radius = 2.4;
  const target = new THREE.Vector3(0,0.4,0);
  function updateCamera(){
    camera.position.set(
      target.x + radius*Math.cos(elevation)*Math.sin(azimuth),
      target.y + radius*Math.sin(elevation),
      target.z + radius*Math.cos(elevation)*Math.cos(azimuth)
    );
    camera.lookAt(target);
  }
  updateCamera();

  let dragging=false, lastX=0, lastY=0;
  renderer.domElement.style.cursor = 'grab';
  renderer.domElement.addEventListener('pointerdown', function(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    renderer.domElement.style.cursor = 'grabbing';
  });
  window.addEventListener('pointerup', function(){
    dragging=false;
    renderer.domElement.style.cursor = 'grab';
  });
  window.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    azimuth -= dx*0.005;
    elevation = Math.max(-1.3, Math.min(1.4, elevation + dy*0.005));
    lastX=e.clientX; lastY=e.clientY;
    updateCamera();
  });
  renderer.domElement.addEventListener('wheel', function(e){
    e.preventDefault();
    radius = Math.max(0.8, Math.min(6, radius + e.deltaY*0.002));
    updateCamera();
  }, {passive:false});

  window.addEventListener('resize', function(){
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });

  const speedSlider = document.getElementById('trompo-speed');
  const speedOut = document.getElementById('trompo-speed-out');
  speedSlider.addEventListener('input', function(){
    speed = parseFloat(speedSlider.value);
    speedOut.textContent = speed.toFixed(1) + 'x';
  });

  const playBtn = document.getElementById('trompo-play');
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.innerHTML = playing
      ? '<i class="ti ti-player-pause" aria-hidden="true"></i> Pausar'
      : '<i class="ti ti-player-play" aria-hidden="true"></i> Reproducir';
  });

  const trailCheck = document.getElementById('trompo-trail');
  trailCheck.addEventListener('change', function(){
    showTrail = trailCheck.checked;
    if(!showTrail) resetTrail();
  });

  const resetBtn = document.getElementById('trompo-reset');
  resetBtn.addEventListener('click', function(){
    state = [theta0, 0.5, phi0, psi0];
    simTime = 0;
    resetTrail();
  });

  let lastT = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    let dtReal = (now-lastT)/1000;
    lastT = now;
    dtReal = Math.min(dtReal, 0.05);
    if(playing){
      let dtSim = dtReal*speed;
      const SUBDT=0.0004;
      let nSteps = Math.max(1, Math.round(dtSim/SUBDT));
      const h = dtSim/nSteps;
      for(let i=0;i<nSteps;i++){
        state = rk4(state, h);
        simTime += h;
      }
    }
    updateOrientation();
    document.getElementById('trompo-readout-t').textContent = simTime.toFixed(2);
    document.getElementById('trompo-readout-theta').textContent = (state[0]*180/Math.PI).toFixed(1);
    let phiDeg = (state[2]*180/Math.PI) % 360;
    if (phiDeg < 0) phiDeg += 360;
    document.getElementById('trompo-readout-phi').textContent = phiDeg.toFixed(1);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
